<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop — Social Feed</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#697586;--line:#e7ebf0;--brand:#2878f0;--soft:#eaf2ff;--danger:#d64545}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--brand);color:white}button.secondary{background:#eef1f5;color:var(--text)}button.ghost{background:transparent;color:var(--muted);padding:7px}button:disabled{opacity:.5;cursor:not-allowed}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1080px)/2));gap:12px}
.brand{font-size:22px;font-weight:850;letter-spacing:-.8px;color:var(--brand)}.header-actions{display:flex;gap:8px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#dce8fb;display:inline-grid;place-items:center;color:#2457a6;font-weight:800;flex-shrink:0}
main{max-width:1080px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,650px) minmax(230px,1fr);gap:24px}
.panel,.post,.side-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel{padding:18px}.post{margin-bottom:18px}.post-head{display:flex;align-items:center;gap:10px;padding:14px 16px}.post-head .meta{flex:1}.name{font-weight:750}.muted{color:var(--muted);font-size:13px}.post-image{width:100%;max-height:620px;object-fit:cover;display:block;background:#e9eef6}.post-actions{padding:12px 16px 0;display:flex;gap:12px;align-items:center}.post-actions button{padding:5px 0;background:none;color:var(--text);font-size:14px}.post-actions button.liked{color:var(--danger)}.caption{padding:8px 16px 12px}.caption strong{margin-right:6px}.comments{padding:0 16px 14px}.comment{margin:5px 0;font-size:14px}.comment-form{display:flex;gap:8px;margin-top:10px}.comment-form input{min-width:0;flex:1}.field{width:100%;border:1px solid #d8dee8;border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);outline:none}.field:focus{border-color:var(--brand);box-shadow:0 0 0 3px #2878f018}textarea.field{resize:vertical;min-height:75px}.section-title{font-size:18px;font-weight:800;margin:0 0 14px}.side-card{padding:16px;margin-bottom:16px}.row{display:flex;align-items:center;gap:10px}.row .grow{flex:1;min-width:0}.stack{display:grid;gap:10px}.hidden{display:none!important}.empty{text-align:center;padding:40px 18px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}.profile-top{text-align:center;padding:22px 16px}.profile-top .avatar{width:88px;height:88px;font-size:25px;margin:0 auto 10px}.stats{display:flex;justify-content:center;gap:28px;margin:18px 0}.stat strong{display:block;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:16px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#e9eef6}.grid .grid-empty{aspect-ratio:1;background:#edf1f7;display:grid;place-items:center;color:#8a96a8;font-size:12px;text-align:center;padding:8px}.notice{font-size:12px;color:#6a7483;background:#f2f5f9;padding:10px 12px;border-radius:10px;margin-top:12px}.modal-backdrop{position:fixed;inset:0;background:#11182788;display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(430px,100%);background:white;border-radius:18px;padding:22px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 6px}.modal p{margin:0 0 16px;color:var(--muted);font-size:14px}.modal .stack{gap:12px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.tabs button.active{background:#1759c9}.preview{width:100%;max-height:260px;object-fit:contain;background:#f0f3f8;border-radius:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:11px 16px;border-radius:12px;z-index:20;box-shadow:0 6px 24px #0002}
@media(max-width:780px){main{grid-template-columns:1fr;margin-top:14px}.sidebar{display:none}header{padding:0 14px}.brand{font-size:20px}.header-actions button{padding:9px 10px}}
</style>
</head>
<body>
<header>
  <div class="brand">◉ Loop</div>
  <div class="header-actions">
    <button class="secondary" id="homeBtn">Home</button>
    <button class="secondary" id="profileBtn">My Profile</button>
    <button id="authBtn">Log in</button>
  </div>
</header>
<main>
  <section>
    <div id="feedView">
      <div class="panel" style="margin-bottom:18px">
        <div class="row">
          <div class="avatar" id="composerAvatar">G</div>
          <button class="secondary" style="text-align:left;flex:1" id="openComposer">Share a photo or update…</button>
        </div>
      </div>
      <div id="feed"></div>
    </div>
    <div id="profileView" class="hidden"></div>
  </section>
  <aside class="sidebar">
    <div class="side-card">
      <div class="row"><div class="avatar" id="sideAvatar">G</div><div class="grow"><div class="name" id="sideName">Guest</div><div class="muted" id="sideHandle">@guest</div></div></div>
      <div class="notice">Prototype mode: this version saves data only in this browser. Firebase will be connected in the next step.</div>
    </div>
    <div class="side-card">
      <div class="section-title">Quick guide</div>
      <div class="muted">• Create an account or log in<br>• Upload a photo and write a caption<br>• Like, comment, follow people<br>• Open My Profile to edit your profile</div>
    </div>
  </aside>
</main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const $ = id => document.getElementById(id);
const STORE = 'loop_social_prototype_v1';
const demoPosts = [
 {id:'demo1',userId:'maya',username:'Maya Patel',handle:'@maya.creates',avatar:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&h=120&fit=crop',image:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000&auto=format&fit=crop',caption:'A little sunshine makes everything better ☀️',likes:12,liked:false,comments:[{name:'Aarav',text:'Beautiful view!'}]},
 {id:'demo2',userId:'aarav',username:'Aarav Shah',handle:'@aarav.shah',avatar:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&h=120&fit=crop',image:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1000&auto=format&fit=crop',caption:'Weekend reset 🌊',likes:8,liked:false,comments:[]},
 {id:'demo3',userId:'riya',username:'Riya Mehta',handle:'@riya.m',avatar:'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=120&h=120&fit=crop',image:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=1000&auto=format&fit=crop',caption:'Flowers for no reason are the best kind.',likes:23,liked:false,comments:[]}
];
let state = load();
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s)return s}catch(e){}return {users:[],current:null,posts:demoPosts.map(p=>({...p,comments:[...p.comments]})),following:[]}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function me(){return state.users.find(u=>u.id===state.current)||null}
function escapeHTML(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(name='Guest'){return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'G'}
function avatarHTML(url,name,cls='avatar'){return url?`<img class="${cls}" src="${escapeHTML(url)}" alt="${escapeHTML(name)}" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class=\\'avatar\\'>${initials(name)}</span>')">`:`<div class="${cls}">${initials(name)}</div>`}
function notify(msg){$('toastRoot').innerHTML=`<div class="toast">${escapeHTML(msg)}</div>`;setTimeout(()=>$('toastRoot').innerHTML='',2300)}
function syncHeader(){const u=me();$('authBtn').textContent=u?'Log out':'Log in';$('composerAvatar').outerHTML=avatarHTML(u?.photo,u?.username||'Guest','avatar').replace('<img','<img id="composerAvatar"').replace('<div','<div id="composerAvatar"');$('sideAvatar').outerHTML=avatarHTML(u?.photo,u?.username||'Guest','avatar').replace('<img','<img id="sideAvatar"').replace('<div','<div id="sideAvatar"');$('sideName').textContent=u?.username||'Guest';$('sideHandle').textContent=u?'@'+u.username.toLowerCase().replace(/\s+/g,''):'@guest'}
function showModal(content){$('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal">${content}</div></div>`;$('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()})}
function closeModal(){$('modalRoot').innerHTML=''}
function authModal(tab='login'){showModal(`<h2>Welcome to Loop</h2><p>Sign in or create a local prototype account.</p><div class="tabs"><button class="${tab==='login'?'active':''}" id="loginTab">Log in</button><button class="${tab==='signup'?'active':''}" id="signupTab">Sign up</button></div><form id="authForm" class="stack">${tab==='signup'?'<input class="field" name="username" placeholder="Username" required maxlength="30">':''}<input class="field" name="email" type="email" placeholder="Email address" required><input class="field" name="password" type="password" placeholder="Password (min 6 characters)" required minlength="6"><button>${tab==='signup'?'Create account':'Log in'}</button><div class="muted">Demo only — do not use a real password. Firebase Authentication will be added later.</div></form>`);$('loginTab').onclick=()=>authModal('login');$('signupTab').onclick=()=>authModal('signup');$('authForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));if(tab==='signup'){if(state.users.some(u=>u.email===email)){notify('That email already exists in this browser');return}const u={id:'u'+Date.now(),email,password,username:String(f.get('username')).trim(),bio:'',photo:''};state.users.push(u);state.current=u.id;save();closeModal();render();notify('Account created on this device')}else{const u=state.users.find(x=>x.email===email&&x.password===password);if(!u){notify('Account not found. Sign up first.');return}state.current=u.id;save();closeModal();render();notify('Logged in')}}}
function render(){syncHeader();renderFeed();if(!$('profileView').classList.contains('hidden'))renderProfile()}
function renderFeed(){$('feed').innerHTML=state.posts.slice().reverse().map(p=>`<article class="post"><div class="post-head">${avatarHTML(p.avatar,p.username)}<div class="meta"><div class="name">${escapeHTML(p.username)}</div><div class="muted">${escapeHTML(p.handle||'@'+p.username.toLowerCase().replace(/\s+/g,''))}</div></div>${p.userId!=='demo'&&p.userId!=='maya'&&p.userId!=='aarav'&&p.userId!=='riya'&&me()?.id!==p.userId?`<button class="secondary" onclick="toggleFollow('${p.userId}')">${state.following.includes(p.userId)?'Following':'Follow'}</button>`:''}</div><img class="post-image" src="${escapeHTML(p.image)}" alt="Post photo" onerror="this.style.display='none'"><div class="post-actions"><button class="${p.liked?'liked':''}" onclick="toggleLike('${p.id}')">${p.liked?'♥ Liked':'♡ Like'} · ${p.likes||0}</button><button onclick="document.getElementById('comment-${p.id}').focus()">Comment · ${p.comments.length}</button></div><div class="caption"><strong>${escapeHTML(p.username)}</strong>${escapeHTML(p.caption)}</div><div class="comments">${p.comments.map(c=>`<div class="comment"><strong>${escapeHTML(c.name)}</strong> ${escapeHTML(c.text)}</div>`).join('')}<form class="comment-form" onsubmit="addComment(event,'${p.id}')"><input class="field" id="comment-${p.id}" placeholder="Add a comment…" maxlength="300" required><button>Post</button></form></div></article>`).join('')||'<div class="panel empty"><strong>No posts yet</strong>Upload the first photo to get started.</div>'}
function toggleLike(id){const p=state.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes=Math.max(0,(p.likes||0)+(p.liked?1:-1));save();renderFeed()}
function addComment(e,id){e.preventDefault();const u=me();if(!u){authModal();notify('Create an account to comment');return}const p=state.posts.find(x=>x.id===id),input=$('comment-'+id);if(p&&input.value.trim()){p.comments.push({name:u.username,text:input.value.trim()});save();renderFeed()}}
function toggleFollow(id){if(!me()){authModal('signup');return}state.following.includes(id)?state.following=state.following.filter(x=>x!==id):state.following.push(id);save();renderFeed();notify(state.following.includes(id)?'Followed':'Unfollowed')}
function openComposer(){if(!me()){authModal('signup');notify('Create an account to post');return}showModal(`<h2>Create a post</h2><p>Choose a photo from your device and add a caption.</p><form id="postForm" class="stack"><input class="field" id="photoFile" type="file" accept="image/*" required><img id="photoPreview" class="preview hidden" alt="Photo preview"><textarea class="field" name="caption" placeholder="Write a caption…" maxlength="1000"></textarea><button>Share post</button></form>`);$('photoFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{$('photoPreview').src=r.result;$('photoPreview').classList.remove('hidden')};r.readAsDataURL(file)};$('postForm').onsubmit=e=>{e.preventDefault();const file=$('photoFile').files[0];if(!file)return;if(file.size>2*1024*1024){notify('Please choose an image under 2 MB for this prototype');return}const r=new FileReader();r.onload=()=>{const u=me();state.posts.push({id:'p'+Date.now(),userId:u.id,username:u.username,handle:'@'+u.username.toLowerCase().replace(/\s+/g,''),avatar:u.photo,image:r.result,caption:new FormData(e.target).get('caption')||'',likes:0,liked:false,comments:[]});save();closeModal();showFeed();render();notify('Post added on this device')};r.readAsDataURL(file)}}
function showFeed(){$('feedView').classList.remove('hidden');$('profileView').classList.add('hidden')}
function showProfile(){if(!me()){authModal('signup');return}$('feedView').classList.add('hidden');$('profileView').classList.remove('hidden');renderProfile()}
function renderProfile(){const u=me();if(!u){$('profileView').innerHTML='<div class="panel empty"><strong>Log in to see your profile</strong></div>';return}const posts=state.posts.filter(p=>p.userId===u.id);$('profileView').innerHTML=`<div class="panel"><div class="profile-top">${avatarHTML(u.photo,u.username)}<h2 style="margin:8px 0 2px">${escapeHTML(u.username)}</h2><div class="muted">@${escapeHTML(u.username.toLowerCase().replace(/\\s+/g,''))}</div><p>${escapeHTML(u.bio||'No bio yet.')}</p><div class="stats"><div class="stat"><strong>${posts.length}</strong><span class="muted">Posts</span></div><div class="stat"><strong>—</strong><span class="muted">Followers*</span></div><div class="stat"><strong>${state.following.length}</strong><span class="muted">Following</span></div></div><button id="editProfile" class="secondary">Edit profile</button><div class="notice">*Real follower counts require Firebase and will be connected next.</div></div><div class="grid">${posts.length?posts.map(p=>`<img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.caption)}">`).join(''):'<div class="grid-empty">Your photos<br>appear here</div>'.repeat(3)}</div></div>`;$('editProfile').onclick=editProfile}
function editProfile(){const u=me();showModal(`<h2>Edit profile</h2><p>Update your local profile details.</p><form id="editForm" class="stack"><input class="field" name="username" placeholder="Username" value="${escapeHTML(u.username)}" maxlength="30" required><textarea class="field" name="bio" placeholder="Bio (up to 160 characters)" maxlength="160">${escapeHTML(u.bio||'')}</textarea><label class="muted">Profile photo <input class="field" id="profilePhoto" type="file" accept="image/*"></label><button>Save profile</button></form>`);$('editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);u.username=String(f.get('username')).trim();u.bio=String(f.get('bio')).trim();const file=$('profilePhoto').files[0];const finish=()=>{state.posts.forEach(p=>{if(p.userId===u.id){p.username=u.username;p.handle='@'+u.username.toLowerCase().replace(/\s+/g,'');p.avatar=u.photo}});save();closeModal();render();renderProfile();notify('Profile updated')};if(file){if(file.size>2*1024*1024){notify('Please choose an image under 2 MB');return}const r=new FileReader();r.onload=()=>{u.photo=r.result;finish()};r.readAsDataURL(file)}else finish()}}
$('homeBtn').onclick=()=>{showFeed();render()};$('profileBtn').onclick=showProfile;$('authBtn').onclick=()=>{if(me()){state.current=null;save();render();notify('Logged out')}else authModal('login')};$('openComposer').onclick=openComposer;
render();
</script>
</body>
</html>
